name: Validate Static Learning Lab

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check required core files
        shell: bash
        run: |
          set -e
          required=(
            "index.html" "styles.css" "app.js" "README.md" "legacy-live-smoke.html"
            "docs/index.html" "docs/styles.css" "docs/app.js" "docs/PREVIEW-BOUNDARY.md"
            "tests/contracts/hed3505-r3-r10-contract.mjs" "tests/contracts/hed3505-teacher-command-center-contract.mjs" "docs/governance/HED3505-R3-R10-READINESS.md"
            "tests/neon/hed3505-auth-rbac.mjs" "tests/neon/hed3505-authorization-matrix.mjs"
            "auth-test/index.html" "auth-test/package.json" "auth-test/vite.config.js" "auth-test/src/auth.js" "auth-test/src/main.js"
          )
          for f in "${required[@]}"; do test -f "$f" || { echo "Missing required file: $f"; exit 1; }; done
          echo "PASS: required core/readiness/R2 authorization/teacher contract files exist."

      - name: Validate JavaScript syntax
        run: |
          node --check app.js
          node --check docs/app.js
          node --check tests/contracts/hed3505-r3-r10-contract.mjs
          node --check tests/contracts/hed3505-teacher-command-center-contract.mjs
          node --check tests/neon/hed3505-auth-rbac.mjs
          node --check tests/neon/hed3505-authorization-matrix.mjs
          node --check auth-test/src/auth.js
          node --check auth-test/src/main.js
          node --check auth-test/vite.config.js

      - name: Enforce R3-R10 reversible readiness contract
        run: node tests/contracts/hed3505-r3-r10-contract.mjs

      - name: Enforce Teacher Command Center synthetic contract
        run: node tests/contracts/hed3505-teacher-command-center-contract.mjs

      - name: R2 auth and authorization source security guard
        shell: bash
        run: |
          set -e
          targets=(auth-test tests/neon/hed3505-auth-rbac.mjs tests/neon/hed3505-authorization-matrix.mjs)
          if grep -R -E 'br-hidden-dream-b3jh4lgz|password[[:space:]]*=|JWT[[:space:]]*=|OTP[[:space:]]*=' "${targets[@]}" --exclude-dir=node_modules; then
            echo "FAIL: forbidden production identifier or credential-like assignment found in R2 source."
            exit 1
          fi
          grep -q "Refusing to fall back to production" auth-test/src/auth.js
          grep -q "genuine ephemeral authenticated sessions" tests/neon/hed3505-authorization-matrix.mjs
          grep -q "RLS-05" tests/neon/hed3505-authorization-matrix.mjs
          grep -q "TEACHER-01" tests/neon/hed3505-authorization-matrix.mjs
          grep -q "AUDIT-02" tests/neon/hed3505-authorization-matrix.mjs
          echo "PASS: R2 source remains fail-closed; executable authorization assertions are present; no forbidden production identifier detected."

      - name: Build isolated R2 auth UI
        working-directory: auth-test
        run: |
          npm install
          npm run check
          npm run build
          test -f dist/index.html
          test -d dist/assets
          echo "PASS: isolated R2 auth UI built successfully."

      - name: Check five module labels
        shell: bash
        run: |
          set -e
          for n in 1 2 3 4 5; do
            grep -q "id:$n" app.js || { echo "Missing module $n in core app"; exit 1; }
            grep -q "id:$n" docs/app.js || { echo "Missing module $n in preview app"; exit 1; }
          done
          grep -q "Prompt → Tap → Reveal → Discuss → Decide → Save" README.md
          echo "PASS: five-module activity baseline detected."

      - name: Privacy boundary check
        shell: bash
        run: |
          set -e
          if grep -Ei "national.?id|passport|student.?id.*input|name=.*student|email.*input|grade.*input" index.html app.js docs/index.html docs/app.js; then
            echo "FAIL: review privacy-sensitive learner input reference."
            exit 1
          fi
          echo "PASS: no obvious learner identity/grade input fields detected."

      - name: Preview isolation check
        shell: bash
        run: |
          set -e
          if grep -niE "supabase|live-config|signInWithOtp|postgres_changes|projectUrl|publishableKey" docs/index.html docs/app.js docs/styles.css; then
            echo "FAIL: backend/live-test dependency leaked into isolated preview source."
            exit 1
          fi
          if find docs -type f -maxdepth 1 | grep -E "legacy-live-smoke|live-config"; then
            echo "FAIL: legacy/live config file leaked into preview source."
            exit 1
          fi
          echo "PASS: docs/ preview source is static-only and backend-independent."

      - name: Preview parity check
        shell: bash
        run: |
          set -e
          cmp -s styles.css docs/styles.css || { echo "FAIL: preview styles diverge from approved core learner styles"; exit 1; }
          cmp -s app.js docs/app.js || { echo "FAIL: preview app diverges from approved core learner app"; exit 1; }
          grep -q "Prompt → Tap → Reveal → Discuss → Decide → Save" docs/index.html
          grep -q "HED3505 Interactive Learning Lab" docs/index.html
          grep -q "Static learner flow only" docs/index.html
          echo "PASS: preview learner app/styles match core; preview index differs only by controlled-preview boundary messaging."
