name: HED3505 Final Class Pages Preservation QA
on:
  push:
    branches: [hed3505-final-class-neon-staging-01]
    paths:
      - 'neon-final-class/**'
      - '.github/workflows/hed3505-final-class-pages.yml'
  pull_request:
    paths:
      - 'neon-final-class/**'
      - '.github/workflows/hed3505-final-class-pages.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: hed3505-final-class-preservation-qa
  cancel-in-progress: false
jobs:
  build-and-preservation-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install and build isolated application
        working-directory: neon-final-class
        run: |
          npm install --package-lock-only --ignore-scripts
          npm ci
          npm run build
      - name: Verify static output and reject sensitive material
        shell: bash
        run: |
          set -euo pipefail
          test -s neon-final-class/dist/index.html
          test -n "$(find neon-final-class/dist/assets -name '*.js' -print -quit)"
          if grep -R -E 'postgres(ql)?://|DATABASE_URL=|NEON_API_KEY=|PRIVATE_KEY|SERVICE_ROLE_KEY' neon-final-class/dist; then
            echo 'Sensitive material detected in public build'; exit 1
          fi
      - name: Preservation gate — require authoritative Learning Hub artifact
        shell: bash
        run: |
          set -euo pipefail
          echo 'Final-Class build is isolated. Existing Pages site must not be replaced.'
          echo 'A complete, verified Learning Hub artifact is required before any combined Pages release.'
          test ! -e _site
          test ! -e neon-final-class/dist/final-class
          echo 'PRESERVATION: HOLD (no combined artifact assembled or deployed)'
      - name: Upload isolated QA artifact only
        uses: actions/upload-artifact@v4
        with:
          name: hed3505-final-class-build-only
          path: neon-final-class/dist
          retention-days: 7
