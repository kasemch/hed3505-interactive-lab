name: HED3505 Neon Controlled Runtime Gate

# NON-PRODUCTION ONLY. Authenticated checks use pre-verified synthetic
# email/password accounts on the isolated HED3505 sandbox branch.
# Never print or persist passwords, JWTs, session cookies, or response bodies.

on:
  workflow_dispatch:
    inputs:
      gate:
        description: 'Runtime gate to execute'
        required: true
        default: 'preflight'
        type: choice
        options:
          - preflight
          - authenticated-rls
      confirm_sandbox:
        description: 'Type HED3505-SANDBOX to authorize non-production network tests'
        required: true
        type: string
      confirm_branch_id:
        description: 'Type the approved sandbox branch ID exactly'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: hed3505-neon-controlled-runtime-${{ github.ref }}
  cancel-in-progress: false

env:
  HED3505_EXPECTED_PROJECT_ID: winter-sun-55259147
  HED3505_EXPECTED_SANDBOX_BRANCH_ID: br-steep-hall-b3nm8s2p
  HED3505_EXPECTED_DATABASE: neondb
  HED3505_FORBIDDEN_PRODUCTION_BRANCH_ID: br-hidden-dream-b3jh4lgz
  HED3505_STAGING_ORIGIN: https://staging.kengkasem.com
  HED3505_NEON_AUTH_URL: https://ep-broad-haze-b3jbuo1d.neonauth.c-4.ap-southeast-1.aws.neon.tech/neondb/auth
  HED3505_NEON_DATA_API_URL: https://ep-broad-haze-b3jbuo1d.apirest.c-4.ap-southeast-1.aws.neon.tech/neondb/rest/v1

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Validate sandbox authorization and exact target
        shell: bash
        env:
          CONFIRM_SANDBOX: ${{ inputs.confirm_sandbox }}
          CONFIRM_BRANCH_ID: ${{ inputs.confirm_branch_id }}
        run: |
          test "$CONFIRM_SANDBOX" = 'HED3505-SANDBOX' || {
            echo '::error::Sandbox confirmation mismatch; refusing runtime test.'
            exit 1
          }
          test "$CONFIRM_BRANCH_ID" = "$HED3505_EXPECTED_SANDBOX_BRANCH_ID" || {
            echo '::error::Sandbox branch confirmation mismatch; refusing runtime test.'
            exit 1
          }
          test "$HED3505_EXPECTED_DATABASE" = 'neondb' || {
            echo '::error::Unexpected database target; refusing runtime test.'
            exit 1
          }
          case "$HED3505_NEON_AUTH_URL" in https://*) ;; *) echo '::error::Auth endpoint must use HTTPS'; exit 1;; esac
          case "$HED3505_NEON_DATA_API_URL" in https://*) ;; *) echo '::error::Data API endpoint must use HTTPS'; exit 1;; esac
          if [[ "$HED3505_NEON_AUTH_URL $HED3505_NEON_DATA_API_URL" == *"$HED3505_FORBIDDEN_PRODUCTION_BRANCH_ID"* ]]; then
            echo '::error::Production branch identifier detected; refusing runtime test.'
            exit 1
          fi
          echo 'Target: approved non-production sandbox; endpoint and branch guards: PASS'

      - name: Verify anonymous deny on the sandbox Data API
        shell: bash
        run: |
          probe() {
            local label="$1"
            shift
            local tmp status message normalized
            tmp=$(mktemp)
            status=$(curl --silent --show-error --output "$tmp" --write-out '%{http_code}' "$@")
            message=$(python3 - "$tmp" <<'PY'
          import json, re, sys
          try:
              with open(sys.argv[1], encoding='utf-8') as f:
                  body = json.load(f)
              value = str(body.get('message') or body.get('error_description') or '')
              value = re.sub(r'https?://\S+', '[url-redacted]', value)
              value = re.sub(r'[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.[A-Za-z]{2,}', '[email-redacted]', value)
              print(value[:180].replace('\n', ' ').replace('\r', ' '))
          except Exception:
              print('')
          PY
            )
            rm -f "$tmp"
            case "$status" in
              401|403) return 0 ;;
              400)
                normalized=$(printf '%s' "$message" | tr '[:upper:]' '[:lower:]')
                [[ "$normalized" == *"missing authentication credentials"* && "$normalized" == *"authorization bearer token"* && "$normalized" == *"jwt"* ]] && return 0
                return 2 ;;
              2??) return 1 ;;
              *) return 3 ;;
            esac
          }
          set +e
          probe schema-header --header 'accept-profile: hed3505' "$HED3505_NEON_DATA_API_URL/learner_identity?select=learner_id&limit=1"; schema_rc=$?
          probe default-profile "$HED3505_NEON_DATA_API_URL/learner_identity?select=learner_id&limit=1"; default_rc=$?
          set -e
          [[ $schema_rc -eq 0 && $default_rc -eq 0 ]] || {
            echo '::error::Anonymous deny is not verified on the approved sandbox.'
            exit 1
          }
          echo 'Anonymous deny: PASS'

  authenticated-rls:
    if: ${{ inputs.gate == 'authenticated-rls' }}
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: hed3505-r2-runtime-runner-main-01
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate ephemeral synthetic account inputs without printing values
        shell: bash
        env:
          HED3505_SYNTH_STUDENT_A_EMAIL: ${{ secrets.HED3505_SYNTH_STUDENT_A_EMAIL }}
          HED3505_SYNTH_STUDENT_A_PASSWORD: ${{ secrets.HED3505_SYNTH_STUDENT_A_PASSWORD }}
          HED3505_SYNTH_STUDENT_B_EMAIL: ${{ secrets.HED3505_SYNTH_STUDENT_B_EMAIL }}
          HED3505_SYNTH_STUDENT_B_PASSWORD: ${{ secrets.HED3505_SYNTH_STUDENT_B_PASSWORD }}
          HED3505_SYNTH_TEACHER_EMAIL: ${{ secrets.HED3505_SYNTH_TEACHER_EMAIL }}
          HED3505_SYNTH_TEACHER_PASSWORD: ${{ secrets.HED3505_SYNTH_TEACHER_PASSWORD }}
        run: |
          for name in HED3505_SYNTH_STUDENT_A_EMAIL HED3505_SYNTH_STUDENT_A_PASSWORD HED3505_SYNTH_STUDENT_B_EMAIL HED3505_SYNTH_STUDENT_B_PASSWORD HED3505_SYNTH_TEACHER_EMAIL HED3505_SYNTH_TEACHER_PASSWORD; do
            test -n "${!name}" || { echo "::error::Missing required synthetic test secret: $name"; exit 1; }
          done
          echo 'Synthetic test account secret presence: PASS'
      - name: Run synthetic Auth, RLS isolation, and persistence matrix
        env:
          HED3505_TEST_RUN_ID: ${{ github.run_id }}-${{ github.run_attempt }}
          HED3505_SYNTH_STUDENT_A_EMAIL: ${{ secrets.HED3505_SYNTH_STUDENT_A_EMAIL }}
          HED3505_SYNTH_STUDENT_A_PASSWORD: ${{ secrets.HED3505_SYNTH_STUDENT_A_PASSWORD }}
          HED3505_SYNTH_STUDENT_B_EMAIL: ${{ secrets.HED3505_SYNTH_STUDENT_B_EMAIL }}
          HED3505_SYNTH_STUDENT_B_PASSWORD: ${{ secrets.HED3505_SYNTH_STUDENT_B_PASSWORD }}
          HED3505_SYNTH_TEACHER_EMAIL: ${{ secrets.HED3505_SYNTH_TEACHER_EMAIL }}
          HED3505_SYNTH_TEACHER_PASSWORD: ${{ secrets.HED3505_SYNTH_TEACHER_PASSWORD }}
        run: node tests/neon/hed3505-auth-rbac.mjs
