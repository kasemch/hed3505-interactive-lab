name: HED3505 Neon Controlled Runtime Gate

# NON-PRODUCTION ONLY.
# PR runs execute preflight + credential-free fixture contract checks.
# Authenticated RLS remains explicit workflow_dispatch and requires ephemeral credentials.
# Never print or persist passwords, OTPs, JWTs, session cookies, database URLs, or response bodies.

on:
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/hed3505-neon-security-test.yml'
      - 'tests/neon/**'
      - 'wordpress/hed3505-neon-auth/**'
  workflow_dispatch:
    inputs:
      gate:
        description: 'Runtime gate to execute'
        required: true
        default: 'preflight'
        type: choice
        options:
          - preflight
          - authenticated-rls
      confirm_sandbox:
        description: 'Type HED3505-SANDBOX to authorize non-production network tests'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: hed3505-neon-controlled-runtime-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

env:
  HED3505_EXPECTED_STAGING_ORIGIN: https://staging.kengkasem.com
  HED3505_EXPECTED_PROJECT_ID: winter-sun-55259147
  HED3505_EXPECTED_SANDBOX_BRANCH_ID: br-steep-hall-b3nm8s2p
  HED3505_EXPECTED_DATABASE: neondb
  HED3505_FORBIDDEN_PRODUCTION_BRANCH_ID: br-hidden-dream-b3jh4lgz

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      HED3505_NEON_AUTH_URL: ${{ secrets.HED3505_NEON_AUTH_URL }}
      HED3505_NEON_DATA_API_URL: ${{ secrets.HED3505_NEON_DATA_API_URL }}
    steps:
      - name: Validate trigger and sandbox authorization
        shell: bash
        run: |
          if [[ '${{ github.event_name }}' == 'workflow_dispatch' ]]; then
            test '${{ inputs.confirm_sandbox }}' = 'HED3505-SANDBOX' || {
              echo '::error::Sandbox confirmation mismatch; refusing runtime test.'
              exit 1
            }
          else
            echo 'PR-triggered preflight: authenticated gate is disabled.'
          fi
      - name: Validate endpoint configuration without printing secrets
        shell: bash
        run: |
          test -n "$HED3505_NEON_AUTH_URL" || { echo '::error::Missing HED3505_NEON_AUTH_URL'; exit 1; }
          test -n "$HED3505_NEON_DATA_API_URL" || { echo '::error::Missing HED3505_NEON_DATA_API_URL'; exit 1; }
          case "$HED3505_NEON_AUTH_URL" in https://*) ;; *) echo '::error::Auth endpoint must use HTTPS'; exit 1;; esac
          case "$HED3505_NEON_DATA_API_URL" in https://*) ;; *) echo '::error::Data API endpoint must use HTTPS'; exit 1;; esac
          if [[ "$HED3505_NEON_AUTH_URL $HED3505_NEON_DATA_API_URL" == *"$HED3505_FORBIDDEN_PRODUCTION_BRANCH_ID"* ]]; then
            echo '::error::Production branch identifier detected; refusing runtime test.'
            exit 1
          fi
          echo 'Endpoint presence/HTTPS/production-branch guard: PASS'
      - name: Anonymous deny diagnostic probe
        shell: bash
        run: |
          probe() {
            local label="$1"; shift
            local tmp status code message normalized
            tmp=$(mktemp)
            status=$(curl --silent --show-error --output "$tmp" --write-out '%{http_code}' "$@")
            code=$(python3 - "$tmp" <<'PY'
          import json, sys
          try:
              with open(sys.argv[1], encoding='utf-8') as f: body=json.load(f)
              print(str(body.get('code') or body.get('error') or body.get('error_code') or '')[:80].replace('\n',' ').replace('\r',' '))
          except Exception: print('')
          PY
            )
            message=$(python3 - "$tmp" <<'PY'
          import json, re, sys
          try:
              with open(sys.argv[1], encoding='utf-8') as f: body=json.load(f)
              value=str(body.get('message') or body.get('error_description') or '')
              value=re.sub(r'https?://\S+','[url-redacted]',value)
              value=re.sub(r'[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.[A-Za-z]{2,}','[email-redacted]',value)
              print(value[:180].replace('\n',' ').replace('\r',' '))
          except Exception: print('')
          PY
            )
            rm -f "$tmp"
            if [[ -n "$code" || -n "$message" ]]; then echo "$label: HTTP $status; error_code=${code:-none}; message=${message:-none}"; else echo "$label: HTTP $status; structured_error=unavailable"; fi
            case "$status" in
              401|403) echo "$label: DENY (standard HTTP auth denial)"; return 0;;
              400)
                normalized=$(printf '%s' "$message" | tr '[:upper:]' '[:lower:]')
                if [[ "$normalized" == *"missing authentication credentials"* && "$normalized" == *"authorization bearer token"* && "$normalized" == *"jwt"* ]]; then echo "$label: DENY (Neon missing-JWT authentication denial)"; return 0; fi
                return 2;;
              2??) echo "::error::$label unexpectedly returned HTTP $status"; return 1;;
              *) return 3;;
            esac
          }
          set +e
          probe 'schema-header' --header 'accept-profile: hed3505' "$HED3505_NEON_DATA_API_URL/learner_identity?select=learner_id&limit=1"; schema_rc=$?
          probe 'default-profile-control' "$HED3505_NEON_DATA_API_URL/learner_identity?select=learner_id&limit=1"; control_rc=$?
          set -e
          if [[ $schema_rc -eq 0 && $control_rc -eq 0 ]]; then echo 'Anonymous deny: PASS'; exit 0; fi
          echo '::error::Anonymous deny remains unverified.'; exit 1

  fixture-contract:
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate synthetic fixture contract
        env:
          HED3505_NEON_DATA_API_URL: ${{ secrets.HED3505_NEON_DATA_API_URL }}
        run: node tests/neon/hed3505-fixture-contract.mjs

  authenticated-rls:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.gate == 'authenticated-rls' }}
    needs: [preflight, fixture-contract]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate ephemeral authenticated inputs without printing values
        shell: bash
        env:
          HED3505_NEON_AUTH_URL: ${{ secrets.HED3505_NEON_AUTH_URL }}
          HED3505_NEON_DATA_API_URL: ${{ secrets.HED3505_NEON_DATA_API_URL }}
          HED3505_STUDENT_A_EMAIL: ${{ secrets.HED3505_STUDENT_A_EMAIL }}
          HED3505_STUDENT_A_OTP: ${{ secrets.HED3505_STUDENT_A_OTP }}
          HED3505_STUDENT_B_EMAIL: ${{ secrets.HED3505_STUDENT_B_EMAIL }}
          HED3505_STUDENT_B_OTP: ${{ secrets.HED3505_STUDENT_B_OTP }}
          HED3505_TEACHER_EMAIL: ${{ secrets.HED3505_TEACHER_EMAIL }}
          HED3505_TEACHER_OTP: ${{ secrets.HED3505_TEACHER_OTP }}
        run: |
          for n in HED3505_NEON_AUTH_URL HED3505_NEON_DATA_API_URL HED3505_STUDENT_A_EMAIL HED3505_STUDENT_A_OTP HED3505_STUDENT_B_EMAIL HED3505_STUDENT_B_OTP HED3505_TEACHER_EMAIL HED3505_TEACHER_OTP; do
            test -n "${!n}" || { echo "::error::Missing required ephemeral runtime input: $n"; exit 1; }
          done
          echo 'Ephemeral input presence: PASS'
      - name: Run synthetic Auth/RLS matrix
        env:
          HED3505_STAGING_ORIGIN: https://staging.kengkasem.com
          HED3505_NEON_AUTH_URL: ${{ secrets.HED3505_NEON_AUTH_URL }}
          HED3505_NEON_DATA_API_URL: ${{ secrets.HED3505_NEON_DATA_API_URL }}
          HED3505_STUDENT_A_EMAIL: ${{ secrets.HED3505_STUDENT_A_EMAIL }}
          HED3505_STUDENT_A_OTP: ${{ secrets.HED3505_STUDENT_A_OTP }}
          HED3505_STUDENT_B_EMAIL: ${{ secrets.HED3505_STUDENT_B_EMAIL }}
          HED3505_STUDENT_B_OTP: ${{ secrets.HED3505_STUDENT_B_OTP }}
          HED3505_TEACHER_EMAIL: ${{ secrets.HED3505_TEACHER_EMAIL }}
          HED3505_TEACHER_OTP: ${{ secrets.HED3505_TEACHER_OTP }}
        run: node tests/neon/hed3505-auth-rbac.mjs
